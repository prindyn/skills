<!--
  Form Component Template — refactor-design skill
  Demonstrates: field hierarchy, label/value relationships, spacing groups,
                error states, validation, accessible focus rings, and button hierarchy.

  Key principles applied:
  - Labels de-emphasized (lighter, smaller, uppercase) — values are primary
  - Spacing groups related fields closer together, unrelated fields farther apart
  - Error state uses icon + text + border — never color alone
  - Primary action visually distinct from secondary
  - Help text uses tertiary color to avoid competing with labels
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Components</title>
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    body {
      background: var(--color-bg-page);
      padding: var(--space-12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--color-text-primary);
    }

    h2 {
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      text-transform: uppercase;
      letter-spacing: var(--tracking-widest);
      color: var(--color-text-tertiary);
      margin: 0 0 var(--space-6) 0;
    }

    /* ── FORM CONTAINER ────────────────────────────────────────────────── */
    .form-card {
      background: var(--color-bg-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border-default);
      padding: var(--space-8);
      max-width: 480px;
      box-shadow: var(--shadow-sm);
    }

    .form-title {
      font-size: var(--text-2xl);
      font-weight: var(--font-bold);
      letter-spacing: var(--tracking-tight);
      color: var(--color-text-primary);
      margin: 0 0 var(--space-1) 0;
    }

    .form-subtitle {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin: 0 0 var(--space-8) 0;
    }

    /* ── FIELD ─────────────────────────────────────────────────────────── */
    .field {
      display: flex;
      flex-direction: column;
      gap: var(--space-1_5);
    }

    /* Fields within the same logical group are spaced closer */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    /* Groups themselves are spaced farther apart */
    .field-group + .field-group {
      margin-top: var(--space-8);
      padding-top: var(--space-8);
      border-top: 1px solid var(--color-border-default);
    }

    /* ── LABEL ─────────────────────────────────────────────────────────── */
    /* Labels are intentionally de-emphasized — values are what matters */
    .label {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-secondary);
      cursor: pointer;
    }

    .label-required::after {
      content: " *";
      color: var(--red-500);
      font-weight: var(--font-normal);
    }

    /* ── INPUT ─────────────────────────────────────────────────────────── */
    .input {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      font-size: var(--text-base);
      line-height: 1.5;
      color: var(--color-text-primary);
      background: var(--color-bg-surface);
      border: 1.5px solid var(--color-border-default);
      border-radius: var(--radius-md);
      transition: border-color var(--duration-fast) var(--ease-default),
                  box-shadow var(--duration-fast) var(--ease-default);
      outline: none;
      appearance: none;
    }

    .input::placeholder {
      color: var(--color-text-placeholder);
    }

    .input:hover {
      border-color: var(--color-border-strong);
    }

    .input:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px hsl(220 70% 50% / 0.12);
    }

    /* ── ERROR STATE ────────────────────────────────────────────────────── */
    /* Error uses: red border + icon + text — NOT color alone */
    .input.is-error {
      border-color: var(--red-500);
    }

    .input.is-error:focus {
      border-color: var(--red-500);
      box-shadow: 0 0 0 3px hsl(0 72% 51% / 0.12);
    }

    .field-error {
      display: flex;
      align-items: center;
      gap: var(--space-1_5);
      font-size: var(--text-sm);
      color: var(--red-600);
    }

    .field-error svg { flex-shrink: 0; }

    /* ── HELP TEXT ──────────────────────────────────────────────────────── */
    .field-help {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      line-height: 1.5;
    }

    /* ── INLINE FIELDS (side-by-side) ──────────────────────────────────── */
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }

    /* ── SELECT ─────────────────────────────────────────────────────────── */
    .select-wrapper {
      position: relative;
    }

    .select {
      width: 100%;
      padding: var(--space-2) var(--space-8) var(--space-2) var(--space-3);
      font-size: var(--text-base);
      color: var(--color-text-primary);
      background: var(--color-bg-surface);
      border: 1.5px solid var(--color-border-default);
      border-radius: var(--radius-md);
      appearance: none;
      cursor: pointer;
      outline: none;
      transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
    }

    .select:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px hsl(220 70% 50% / 0.12);
    }

    .select-chevron {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--color-text-tertiary);
    }

    /* ── CHECKBOX / RADIO ───────────────────────────────────────────────── */
    .check-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      cursor: pointer;
    }

    .check-input {
      appearance: none;
      width: 1rem;
      height: 1rem;
      margin-top: 2px;
      border: 1.5px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      background: white;
      cursor: pointer;
      flex-shrink: 0;
      transition: all var(--duration-fast);
      position: relative;
    }

    .check-input:checked {
      background: var(--color-action);
      border-color: var(--color-action);
    }

    .check-input:checked::after {
      content: "";
      position: absolute;
      left: 2px; top: -1px;
      width: 7px; height: 11px;
      border: 2px solid white;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .check-input:focus-visible {
      outline: var(--ring-width) solid var(--ring-color);
      outline-offset: var(--ring-offset);
    }

    .check-label {
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      line-height: 1.5;
    }

    .check-label-sub {
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
      margin-top: var(--space-0_5);
    }

    /* ── BUTTONS ─────────────────────────────────────────────────────────── */
    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-3);
      margin-top: var(--space-8);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2_5) var(--space-5);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      cursor: pointer;
      border: 1.5px solid transparent;
      line-height: 1;
      transition: all var(--duration-fast) var(--ease-default);
      white-space: nowrap;
    }

    .btn:focus-visible {
      outline: var(--ring-width) solid var(--ring-color);
      outline-offset: var(--ring-offset);
    }

    .btn-primary {
      background: var(--color-action);
      color: white;
      border-color: var(--color-action);
    }
    .btn-primary:hover  { background: var(--color-action-hover); border-color: var(--color-action-hover); }
    .btn-primary:active { background: var(--color-action-active); }

    /* Secondary is visually lower weight — no fill, just border */
    .btn-secondary {
      background: transparent;
      color: var(--color-text-secondary);
      border-color: var(--color-border-strong);
    }
    .btn-secondary:hover { background: var(--color-bg-subtle); color: var(--color-text-primary); }

    /* Textarea */
    .textarea {
      resize: vertical;
      min-height: 100px;
    }
  </style>
</head>
<body>

  <h2>Form Component</h2>

  <div class="form-card">
    <h1 class="form-title">Create your account</h1>
    <p class="form-subtitle">Start your free 14-day trial. No credit card required.</p>

    <form novalidate>

      <!-- Group 1: Personal info — fields are close together (related) -->
      <div class="field-group">

        <div class="field-row">
          <div class="field">
            <label class="label label-required" for="first-name">First name</label>
            <input class="input" type="text" id="first-name" name="first_name"
                   placeholder="Jordan" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label class="label label-required" for="last-name">Last name</label>
            <input class="input" type="text" id="last-name" name="last_name"
                   placeholder="Diaz" autocomplete="family-name" required>
          </div>
        </div>

        <div class="field">
          <label class="label label-required" for="email">Email address</label>
          <!-- Error state example -->
          <input class="input is-error" type="email" id="email" name="email"
                 value="jordan@" autocomplete="email"
                 aria-describedby="email-error" aria-invalid="true" required>
          <div class="field-error" id="email-error" role="alert">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 4.5v4M8 10.5v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Please enter a valid email address
          </div>
        </div>

        <div class="field">
          <label class="label label-required" for="password">Password</label>
          <input class="input" type="password" id="password" name="password"
                 autocomplete="new-password"
                 aria-describedby="password-help" required>
          <p class="field-help" id="password-help">
            At least 8 characters, including a number and a symbol.
          </p>
        </div>

      </div>

      <!-- Group 2: Account setup — visually separated from personal info -->
      <div class="field-group">

        <div class="field">
          <label class="label" for="team-size">Team size</label>
          <div class="select-wrapper">
            <select class="select" id="team-size" name="team_size">
              <option value="">Select team size...</option>
              <option value="1">Just me</option>
              <option value="2-10" selected>2–10 people</option>
              <option value="11-50">11–50 people</option>
              <option value="51+">51+ people</option>
            </select>
            <svg class="select-chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label class="label" for="about">About your project</label>
          <textarea class="input textarea" id="about" name="about"
                    placeholder="Tell us what you're building..."
                    aria-describedby="about-help"></textarea>
          <p class="field-help" id="about-help">Optional — helps us tailor your experience.</p>
        </div>

      </div>

      <!-- Group 3: Agreements -->
      <div class="field-group">
        <div class="check-group">
          <label class="check-item">
            <input class="check-input" type="checkbox" name="terms" required>
            <div>
              <div class="check-label">
                I agree to the <a href="#" style="color: var(--color-action); text-decoration: underline; text-underline-offset: 2px;">Terms of Service</a>
                and <a href="#" style="color: var(--color-action); text-decoration: underline; text-underline-offset: 2px;">Privacy Policy</a>
              </div>
            </div>
          </label>
          <label class="check-item">
            <input class="check-input" type="checkbox" name="marketing">
            <div>
              <div class="check-label">Send me product updates and tips</div>
              <div class="check-label-sub">About once a month. Unsubscribe any time.</div>
            </div>
          </label>
        </div>
      </div>

      <!-- Actions: secondary (cancel) always lower visual weight than primary -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Create account →</button>
      </div>

    </form>
  </div>

</body>
</html>
